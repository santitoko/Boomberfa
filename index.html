<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Street Bombers 4P - WebRTC P2P Arcade</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0; padding: 0;
      background: #09060f; color: #fff;
      font-family: 'Press Start 2P', monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow-x: hidden;
    }
    #lobby {
      background: #140d21; border: 4px solid #ff007f; padding: 20px;
      border-radius: 12px; text-align: center;
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.45);
      width: 90%; max-width: 520px;
    }
    h1 { color: #00f5d4; font-size: 16px; margin: 0 0 15px 0; text-shadow: 3px 3px #ff007f; letter-spacing: 1px; }
    .field-row { margin-bottom: 12px; text-align: left; }
    label { font-size: 8px; display: block; margin-bottom: 5px; color: #fcee0a; letter-spacing: 0.5px; }
    input[type="text"] {
      width: 100%; padding: 10px; background: #07040d; border: 2px solid #7928ca;
      color: #00f5d4; font-family: inherit; font-size: 10px; outline: none; text-transform: uppercase;
    }
    .color-grid { display: flex; gap: 10px; margin-top: 8px; }
    .color-cell { flex: 1; text-align: center; }
    .color-cell input[type="color"] {
      width: 100%; height: 38px; border: 2px solid #7928ca;
      background: transparent; cursor: pointer; border-radius: 4px;
    }
    #previewBox {
      background: #08050e; border: 2px solid #00f5d4;
      margin: 12px auto; display: flex; justify-content: center; align-items: center;
      width: 110px; height: 110px; border-radius: 6px;
    }
    .btn-row { display: flex; gap: 10px; margin-top: 15px; }
    button {
      flex: 1; padding: 12px 10px; font-family: inherit; font-size: 9px;
      font-weight: bold; cursor: pointer; border: none; outline: none;
      box-shadow: 3px 3px 0 #000; transition: transform 0.1s;
    }
    button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 #000; }
    .btn-host { background: #00f5d4; color: #000; }
    .btn-join { background: #ff007f; color: #fff; }
    .btn-start { background: #fcee0a; color: #000; width: 100%; margin-top: 10px; }
    #statusLog { font-size: 8px; color: #9d8ec2; margin-top: 12px; min-height: 14px; line-height: 1.4; }

    #gameArea { display: none; flex-direction: column; align-items: center; }
    #topBar {
      width: 720px; max-width: 95vw; background: #140d21; border: 3px solid #7928ca;
      padding: 8px 14px; font-size: 9px; display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 6px;
    }
    #gameCanvas {
      background: #11091e; border: 4px solid #ff007f; image-rendering: pixelated;
      box-shadow: 0 0 25px rgba(121, 40, 202, 0.5); max-width: 95vw; height: auto;
    }
    #touchControls {
      display: none; width: 720px; max-width: 95vw; margin-top: 12px;
      justify-content: space-between; align-items: center;
    }
    .dpad {
      display: grid; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(3, 44px); gap: 4px;
    }
    .tbtn {
      background: #1f1430; border: 2px solid #00f5d4; color: #fff; font-size: 14px;
      display: flex; align-items: center; justify-content: center; border-radius: 8px;
    }
    .btn-drop {
      width: 80px; height: 80px; background: #ff007f; border-radius: 50%;
      border: 3px solid #fff; color: #fff; font-size: 10px; display: flex;
      align-items: center; justify-content: center; text-align: center;
    }
  </style>
</head>
<body>

  <div id="lobby">
    <h1>STREET BOMBERS 4P</h1>

    <div class="field-row">
      <label>TU APODO / TAG:</label>
      <input type="text" id="tagInput" value="BANDIDO_1" maxlength="10" />
    </div>

    <label>PERSONALIZAR SKIN:</label>
    <div class="color-grid">
      <div class="color-cell">
        <label>CAMPERA</label>
        <input type="color" id="colJacket" value="#00f5d4" />
      </div>
      <div class="color-cell">
        <label>GORRA</label>
        <input type="color" id="colCap" value="#ff007f" />
      </div>
      <div class="color-cell">
        <label>BERMUDA</label>
        <input type="color" id="colPants" value="#7928ca" />
      </div>
    </div>

    <div id="previewBox">
      <canvas id="previewCanvas" width="96" height="96"></canvas>
    </div>

    <div class="field-row">
      <label>CÓDIGO DE SALA (PARA UNIRTE):</label>
      <input type="text" id="roomCodeInput" placeholder="EJ: CALLE42" maxlength="8" />
    </div>

    <div class="btn-row">
      <button class="btn-host" id="btnHost">CREAR SALA (HOST)</button>
      <button class="btn-join" id="btnJoin">UNIRSE A SALA</button>
    </div>

    <button class="btn-start" id="btnStartGame" style="display: none;">¡ARRANCAR PARTIDA!</button>
    <div id="statusLog">Elegí tu skin y creá o sumate a una sala.</div>
  </div>

  <div id="gameArea">
    <div id="topBar">
      <span id="roomTagDisplay">SALA: -</span>
      <span id="playersCountDisplay">CREW: 1/4</span>
    </div>
    <canvas id="gameCanvas" width="720" height="624"></canvas>

    <div id="touchControls">
      <div class="dpad">
        <div></div><button class="tbtn" id="tUp">▲</button><div></div>
        <button class="tbtn" id="tLeft">◀</button><div></div><button class="tbtn" id="tRight">▶</button>
        <div></div><button class="tbtn" id="tDown">▼</button><div></div>
      </div>
      <button class="btn-drop" id="tBomb">FASO</button>
    </div>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let actx = null;
    function playBeep(freq, type, dur) {
      if (!actx) actx = new AudioCtx();
      try {
        const osc = actx.createOscillator();
        const gain = actx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, actx.currentTime);
        gain.gain.setValueAtTime(0.15, actx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, actx.currentTime + dur);
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.start();
        osc.stop(actx.currentTime + dur);
      } catch (e) {}
    }

    const TILE = 48;
    const COLS = 15;
    const ROWS = 13;

    const SPAWNS = [
      { x: 1, y: 1 },
      { x: COLS - 2, y: ROWS - 2 },
      { x: COLS - 2, y: 1 },
      { x: 1, y: ROWS - 2 }
    ];

    let peer = null;
    let isHost = false;
    let myPeerId = null;
    let connections = {};
    let hostConn = null;

    let players = {};
    let map = [];
    let bombs = [];
    let smokePuffs = [];

    const lobby = document.getElementById('lobby');
    const gameArea = document.getElementById('gameArea');
    const statusLog = document.getElementById('statusLog');
    const btnStartGame = document.getElementById('btnStartGame');
    const previewCanvas = document.getElementById('previewCanvas');
    const pctx = previewCanvas.getContext('2d');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const colJacket = document.getElementById('colJacket');
    const colCap = document.getElementById('colCap');
    const colPants = document.getElementById('colPants');
    const tagInput = document.getElementById('tagInput');
    const roomCodeInput = document.getElementById('roomCodeInput');

    function renderPreview() {
      pctx.clearRect(0, 0, 96, 96);
      drawBandit(pctx, 48, 56, {
        jacket: colJacket.value,
        cap: colCap.value,
        pants: colPants.value
      }, 'down');
    }
    [colJacket, colCap, colPants].forEach(i => i.addEventListener('input', renderPreview));
    renderPreview();

    function drawBandit(c, x, y, skin, dir) {
      c.save();
      c.translate(x, y);

      c.fillStyle = 'rgba(0,0,0,0.35)';
      c.beginPath();
      c.ellipse(0, 14, 14, 6, 0, 0, Math.PI * 2);
      c.fill();

      c.fillStyle = '#ffffff';
      c.fillRect(-9, 10, 6, 5);
      c.fillRect(3, 10, 6, 5);

      c.fillStyle = skin.pants || '#7928ca';
      c.fillRect(-8, 3, 16, 8);

      c.fillStyle = skin.jacket || '#00f5d4';
      c.fillRect(-10, -10, 20, 14);

      c.fillStyle = '#fcee0a';
      c.fillRect(-4, -6, 8, 3);

      c.fillStyle = '#e0a96d';
      c.fillRect(-7, -22, 14, 12);

      c.fillStyle = '#111';
      c.fillRect(-6, -18, 12, 4);

      c.fillStyle = skin.cap || '#ff007f';
      c.fillRect(-8, -25, 16, 6);
      c.fillRect(dir === 'left' ? 6 : -11, -21, 6, 3);

      c.restore();
    }
